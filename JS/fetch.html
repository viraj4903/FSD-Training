<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>
    <style>
        table {
            width: 80%;
            margin:auto;
            padding: 10px;
            font-size: 25px;
            color: red;
            border: 2px solid red;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>s.no.</th>
                <th>Title</th>
                <th>Price</th>
                <th>Image</th>
                <th>Category</th>

            </tr>
        </thead>
        <tbody id="data">
        </tbody>    
    </table>
    <script>
        const ele=document.getElementById("data");
        const URL="https://dummyjson.com/products";
        async function loadProduct(){
            try{
                const res=await fetch(URL);
                const data=await res.json();
                console.log("Data=",data.products);
                let row="";
                data.products.map((i,index)=>{
                    row+=`
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src="${i.images[0]}" alt="${i.title}"></td>
                        <td>${i.price}</td>
                        <td>${i.category}</td>q
                    </tr>
                    `;
                    ele.innerHTML=row;
                })
                
            }
            catch (err){
                console.log("Error=",err);
                ele.innerHTML=`<tr>Network Error</tr>`;
            }
        }
        loadProduct();
    </script>
</body>
</html>
