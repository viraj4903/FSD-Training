<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="box">

    <div class="heading">
        <img src="bus.jpg" width="100" height="100" alt="Bus">
        <h1>Bus Booking System</h1>
    </div>

    <h3>User Information</h3>

    <form id="bookingForm">

        <label for="name">User Name:</label>
        <input type="text" id="name" placeholder="Enter your name">

        <br><br>

        <label for="age">User Age:</label>
        <input type="number" id="age" placeholder="Enter your age">

        <br><br>

        <label for="aadhaar">Aadhaar Number:</label>
        <input type="text" id="aadhaar" placeholder="Enter Aadhaar number">

        <br><br>

        <label for="city">Select Your City:</label>

        <select id="city">
            <option value="">-- Select City --</option>
            <option value="Delhi">Delhi</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Kolkata">Kolkata</option>
            <option value="Chennai">Chennai</option>
        </select>

        <br><br>

        <label for="date">Select Date:</label>
        <input type="date" id="date">

        <br><br>

        <h3>Bus Information</h3>

        <label>Select Your Bus Type:</label>

        <br><br>

        <label for="ac">AC Bus ₹2000</label>
        <input type="radio" id="ac" name="bus" value="AC">

        <br><br>

        <label for="nonac">Non-AC Bus ₹1500</label>
        <input type="radio" id="nonac" name="bus" value="Non-AC">

        <br><br>

        <label for="seat">Select Your Seat:</label>

        <select id="seat">
            <option value="">-- Select Seat --</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>

        <br><br>

        <button type="submit">Book Now</button>

    </form>

    <!-- Booking details will appear here -->
    <div id="ticket"></div>

</div>

<script src="script.js"></script>

</body>
</html>
