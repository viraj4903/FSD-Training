<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Online Book Store</title>
</head>
<body>

     <header>
        <table width="100%">
            <tr>
                <td width="30%" align="center">
                    <img src="images/logo2.png" alt="Store Logo" width="100">
                </td>
                <td>
                    <h1>Online Book Store</h1>
                </td>
            </tr>
        </table>
    </header>

    <nav>
        <hr>
        <table  width="100%" cellspacing="0" cellpadding="10">
            <tr>
                <td align="center"><a href="index.html">Home</a></td>
                <td align="center"><a href="login.html">Login</a></td>
                <td align="center"><a href="registration.html">Registration</a></td>
                <td align="center"><a href="cse.html">Catalogue</a></td>
                <td align="center"><a href="cart.html">Cart</a></td>
            </tr>
        </table>
        <hr>
    </nav>

    <main>
        <table border="1" width="100%" cellspacing="0" cellpadding="10" height="400">
            <tr>
                <td width="20%" valign="top">
                    <table border="1" width="100%" height="100%" cellspacing="0" cellpadding="10">
                        <tr><th align="center"><a href="cse.html">CSE</a></th></tr>
                        <tr><th align="center"><a href="ece.html">ECE</a></th></tr>
                        <tr><th align="center"><a href="eee.html">EEE</a></th></tr>
                        <tr><th align="center"><a href="civil.html">CIVIL</a></th></tr>
                    </table>
                </td>
                <td width="80%" valign="top" align="center">
                    <h2>Registration Page</h2>
                    <form>
                        <table>
                            <tr>
                                <td>Full Name:</td>
                                <td><input type="text" placeholder="Enter Username"></td>
                            </tr>
                            <tr>
                                <td>Password:</td>
                                <td><input type="password" placeholder="Enter Password"></td>
                            </tr>
                             <tr>
                                <td>Email:</td>
                                <td><input type="email" placeholder="Enter Email"></td>
                            </tr>
                            <tr>
                                <td>Mobile No:</td>
                                <td><input type="tel" placeholder="Enter Mobile"></td>
                            </tr>
                            <tr>
                                <td>Gender:</td>
                                <td>
                                    <input type="radio" name="gender" value="male"> Male
                                    <input type="radio" name="gender" value="female"> Female
                                </td>
                            </tr>
                            <tr>
                                <td>Date of Birth:</td>
                                <td>
                                    <select>
                                        <option>DD</option>
                                        </select>
                                    <select>
                                        <option>MM</option>
                                        </select>
                                    <select>
                                        <option>YYYY</option>
                                        </select>
                                </td>
                            </tr>
                            <tr>
                                <td>Known Languages:</td>
                                <td>
                                    <input type="checkbox" name="lang" value="english"> English
                                    <input type="checkbox" name="lang" value="telugu"> Telugu
                                    <input type="checkbox" name="lang" value="hindi"> Hindi
                                    <input type="checkbox" name="lang" value="tamil"> Tamil
                                </td>
                            </tr>
                            <tr>
                                <td valign="top">Address:</td>
                                <td><textarea rows="5" cols="30"></textarea></td>
                            </tr>
                            <tr>
                                <td></td>
                                <td align="center"><input type="submit" value="Submit"> <input type="reset" value="Reset"></td>
                            </tr>
                        </table>
                    </form>
                </td>
            </tr>
        </table>
    </main>

</body>
</html>
