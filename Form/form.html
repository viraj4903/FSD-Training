<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registration Page</h1>

    <form action ="welcome.html">

    <table border="5" cellpadding="2", cellspacing="10">

    <tr>
        
    <td><label><b>Enter Name</b></label></td>
    <td>&nbsp;<input type="text" name="frame" id="frame"></td>

    </tr>

    <tr>

    <td><label><b>Enter College</b></label></td>
    <td>&nbsp;<input type="text" name="college" id="college"></td>

    </tr>

    <tr>

    <td><label><b>Enter Email</b></label></td>
    <td>&nbsp;<input type="text" name="email" id="email"></td>

    </tr>

    <tr>

    <td><label><b>Choose one language</b></label></td>
    <td><input type="radio" name="r">Hindi
    <input type="radio" name="r">English</td>
    
    </tr>

    <tr>

    <td><label><b>Computer Language</b></label></td>
    <td><select name="lang">
        <option name="java">java</option>
        <option name="c">c</option>
        <option name="c++">c++</option>
    </select></td>

    </tr>

    <tr>

    <td><input type="submit" value = "register"></td>
    <td><input type="reset" value = "reset"></td>

    </tr>

    </table>

    </form>
</body>
</html>
