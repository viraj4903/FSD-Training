<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>B.Tech Admission - Student Resistration From</h2>

    <fieldset>
        <legend>personal deatils:</legend>

        <label>First Name: </label>
        <input type="text" name="first" id="first">

        <br><br>

        <label>Last Name: </label>
        <input type="text" name="last" id="last">

        <br><br>

        <label>Date of Birth: </label>
        <input type="date" name="date" id="date">

        <br><br>

        <label>Gender</label>
        <select name="gender">
            <option name="male">Male</option>
            <option name="female">Female</option>
            <option name="other">Other</option>
        </select>
    </fieldset>

    <br>

    <fieldset>
        <legend>Contact Details:</legend>

        <label>Email: </label>
        <input type="text" name="email" id="email">

        <br><br>

        <label>Mobile No. </label>
        <input type="number" name="number" id="number">

        <br><br>

        <label>Address:</label>
        <br>
        <textarea rows="3" cols="30"></textarea>

    </fieldset>

    <br>

    <fieldset>
        <legend>Academic Details:</legend>

        <label>12th Board:</label>
        <input type="text" name="board" id="board">

        <br><br>

        <label>12th percentage:</label>
        <input type="text" name="percentage" id="percentage">

        <br><br>

        <label>Preffered Branch</label>
        <select name="branch">
            <option name="cse">CSE</option>
            <option name="aiml">AIML</option>
            <option name="ds">DS</option>
            <option name="it">IT</option>
            <option name="ece">ECE</option>
        </select>
    </fieldset>

    <br>

    <input type="submit" value = "register">
    <input type="reset" value = "reset">
</body>
</html>
